# 默写助手 · NAS 静态服务配置（nginx）
# 用途：保证 .mjs / .wasm / .onnx 等扩展名返回正确 MIME，离线语音引擎（Kokoro/Piper）才能加载。
# 说明：当前已改为单线程 wasm，不依赖 COOP/COEP 跨源隔离头，普通静态服务器即可；本配置也未加这些头。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 继承 nginx 默认 mime 映射（.js/.json/.html 等）
    include /etc/nginx/mime.types;

    # 关键覆盖：很多 nginx 默认未把 .mjs/.wasm 识别为 JS/wasm，会导致模块加载被浏览器拒绝
    types {
        text/javascript mjs;
        application/wasm wasm;
        application/octet-stream onnx bin data;
    }

    # SPA 友好：找不到文件时回落到 index.html（本应用非 SPA 路由，但可避免子路径下 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 大文件（Kokoro onnx 约 92MB）不断开
    client_max_body_size 0;
    proxy_read_timeout 300s;
}
